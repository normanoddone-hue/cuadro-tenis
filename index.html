<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12234a">
<meta name="description" content="Torneos de tenis del club: cuadros, partidos, ranking y estadísticas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cuadro de Tenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<style>
/* Layout: court-green sidebar on desktop; on phones a slim top bar + fixed bottom nav. One column of content, one job per screen. */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --soft:#e5eee9; --ink:#12201c; --muted:#586a64; --line:#d3dfda;
  --court:#13654f; --court-2:#0f5241; --court-ink:#ffffff; --ball:#d6e23c; --ball-ink:#1c2300; --link:#13654f;
  --danger:#b3261e; --warn:#8a5a00;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --side-w:252px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1412; --surface:#141f1c; --soft:#1a2824; --ink:#e5eeea; --muted:#92a59f; --line:#26362f;
  --court:#1b7a60; --court-2:#145c48; --court-ink:#ffffff; --ball:#dbe64a; --ball-ink:#1c2300; --link:#74d3b1;
  --danger:#ff8f86; --warn:#f0c060; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#141f1c; --soft:#1a2824; --ink:#e5eeea; --muted:#92a59f; --line:#26362f;
  --court:#1b7a60; --court-2:#145c48; --court-ink:#ffffff; --ball:#dbe64a; --ball-ink:#1c2300; --link:#74d3b1;
  --danger:#ff8f86; --warn:#f0c060; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--court)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.ballico{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ball);box-shadow:inset -2px 0 0 rgba(0,0,0,.12);flex:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- shell ---- */
.app{min-height:100%}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--court);color:var(--court-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:22px;line-height:1;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .ballico{width:14px;height:14px}
.evpill{display:flex;align-items:center;gap:6px;min-width:0;max-width:58%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:var(--court-ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.evpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.bnav button .ico{display:grid;place-items:center;width:44px;height:30px;border-radius:999px}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"] .ico{background:var(--ball);color:var(--ball-ink)}
.content .inner{max-width:1180px;margin:0 auto;padding-block:20px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.mfoot{font-size:12px;color:var(--muted);text-align:center}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .topbar,.bnav,.mfoot{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--court);color:var(--court-ink);padding:24px 14px 18px max(14px,env(safe-area-inset-left,0px))}
  .content .inner{padding-block:32px 56px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}
}
.side .brand{padding:0 8px;flex-direction:column;align-items:flex-start;gap:12px;white-space:normal;line-height:1.05}
.brand .logo{width:32px;height:32px;border-radius:8px;background:#f8f8f8;flex:none;display:block}
.side .brand .logo{width:76px;height:76px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.evsw{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--court-2);border:1px solid rgba(255,255,255,.12);color:var(--court-ink);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.evsw:hover{border-color:rgba(255,255,255,.35)}
.evsw small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;font-weight:600}
.evsw b{font-size:15px;line-height:1.25}
.evsw span{font-size:12px;opacity:.75}
.evsw em{font-style:normal;font-size:12px;font-weight:600;color:var(--ball);margin-top:6px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:none;border:none;color:rgba(255,255,255,.78);font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.snav button:hover{background:rgba(255,255,255,.08);color:#fff}
.snav button[aria-current="page"]{background:var(--court-2);color:#fff}
.snav button[aria-current="page"] svg{color:var(--ball)}
.sfoot{margin-top:auto;font-size:12px;opacity:.65;padding:0 8px}

/* ---- page parts ---- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .ey{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.ph h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,40px);line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.ph .sb{color:var(--muted);font-size:14px;margin-top:6px}
.back{background:none;border:none;color:var(--link);font-weight:600;cursor:pointer;padding:0;font-size:14px;align-self:flex-start}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-hd h2 .ct{color:var(--muted);font-size:18px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--court)}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.pri:hover{background:var(--court-2)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.arm{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--court);border-radius:99px}
.progbox{display:flex;flex-direction:column;gap:8px}
.progbox .big{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.progbox .big span{color:var(--muted);font-size:18px}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.on{background:var(--ball);color:var(--ball-ink)}
.tag.g{background:var(--court);color:var(--court-ink)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowbtn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.rowbtn:last-child{border-bottom:none}
.rowbtn:hover{background:var(--soft)}
.rowbtn .n{font-weight:600;min-width:0}
.rowbtn .d{font-size:13px;color:var(--muted);grid-column:1;min-width:0}
.rowbtn .r{grid-row:1/span 2;grid-column:2;text-align:right;font-variant-numeric:tabular-nums}
.sx{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);margin-right:6px;vertical-align:1px}

/* match rows */
.mi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;background:none;border:none;border-bottom:1px solid var(--line);width:100%;cursor:pointer}
.mi:last-child{border-bottom:none}
.mi:hover{background:var(--soft)}
.mi.ro{cursor:default}.mi.ro:hover{background:none}
.mi .hr{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.mi .hr.no{color:var(--muted);font-size:16px}
.mi .pp{display:flex;flex-direction:column;gap:2px;min-width:0}
.mi .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .pl.w{font-weight:700}
.mi .pl.l{color:var(--muted)}
.mi .mt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .sc{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.mi .sc span{letter-spacing:.06em}
.mi .go{font-size:12px;font-weight:700;color:var(--court-ink);background:var(--court);border-radius:999px;padding:5px 10px;white-space:nowrap}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:10px 14px 6px;background:var(--soft);border-bottom:1px solid var(--line)}

/* torneo rows */
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;text-align:left;padding:14px;background:none;border:none;border-bottom:1px solid var(--line);width:100%;cursor:pointer}
.tr:last-child{border-bottom:none}
.tr:hover{background:var(--soft)}
.tr .nm{font-weight:700;font-size:16px}
.tr .st{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tr .st.on{color:var(--ink);font-weight:600}
.tr .chev{grid-row:1/span 3;grid-column:2;color:var(--muted);font-size:22px}
.tr .prog{grid-column:1}

.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--court);outline-offset:0;border-color:var(--court)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* draw */
.draw-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.draw{display:flex;gap:28px;min-width:max-content;padding:4px 2px}
.col{display:flex;flex-direction:column;width:224px;flex:none}
.col-h{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:15px;height:26px}
.col-b{display:flex;flex-direction:column;justify-content:space-around;flex:1}
.mw{position:relative;padding:5px 0}
.col:not(:last-child) .mw::after{content:"";position:absolute;right:-15px;top:50%;width:14px;border-top:2px solid var(--line)}
.col:not(:first-child) .mw::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.match{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0;cursor:pointer;overflow:hidden}
.match:hover{border-color:var(--court)}
.match.bye{opacity:.6;cursor:default}
.match.wait{cursor:default}
.mrow{display:grid;grid-template-columns:18px 1fr repeat(var(--ns,3),20px);align-items:center;gap:4px;padding:5px 8px;font-size:13px;min-height:28px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .sd{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.mrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.mrow.w{background:color-mix(in srgb,var(--ball) 26%,var(--surface))}
.mrow.w .nm{font-weight:700}
.mrow.w .sc{color:var(--ink)}
.mrow .sc.won{color:var(--ink)}
.mrow .tbd{color:var(--muted);font-style:italic}
.mmeta{font-size:11px;color:var(--muted);padding:3px 8px;background:var(--soft);display:flex;justify-content:space-between;gap:6px}
.champ{display:flex;flex-direction:column;justify-content:center;width:180px;flex:none}
.champ .box{background:var(--court);color:var(--court-ink);border-radius:var(--r);padding:14px;text-align:center}
.champ .box small{text-transform:uppercase;letter-spacing:.1em;font-size:11px;opacity:.85}
.champ .box b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;margin-top:4px}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--soft)}
td:nth-child(2),th:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:center;width:40px}
tr:last-child td{border-bottom:none}
.pos1 td:first-child{font-weight:700}
.pts{font-family:var(--f-display);font-size:20px;font-weight:700}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.setgrid{display:grid;grid-template-columns:1fr repeat(var(--ns,3),52px);gap:8px;align-items:center}
.setgrid .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600}
.setgrid input{text-align:center;padding:9px 4px}
.setgrid .tbl{font-size:13px;color:var(--muted);display:flex;flex-direction:column;line-height:1.2}
.setgrid .tbl small{font-size:11px;font-weight:500}
.setgrid{align-items:start}
.setgrid .pn{padding-top:10px}
.setgrid .scell{display:flex;flex-direction:column;gap:4px}
.setgrid .tbin{padding:4px 2px;font-size:12px;border-style:dashed;height:30px}
.mrow .sc sup{font-size:9px;font-weight:600;margin-left:1px;color:var(--muted)}
.setgrid .pn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--muted)}
.note.warn{color:var(--warn)}
.note.err{color:var(--danger)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--court)}
.cklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 12px;max-height:340px;overflow:auto;padding:4px}
.cklist .check{padding:6px 2px;font-size:14px}
.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:none}
.linkx{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;font-weight:600}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{max-width:46ch;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpis b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpis b small,.mini b small{font-size:16px;color:var(--muted)}
.kpis span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpis .prog{margin-top:4px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:none;padding:0;width:100%}
button.hrow{cursor:pointer;border-radius:6px}
button.hrow:hover b{color:var(--link)}
.hrow>span:first-child{display:flex;flex-direction:column;min-width:0}
.hrow b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{font-size:12px;color:var(--muted)}
.hrow .v{font-family:var(--f-display);font-weight:700;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hrow .v small{font-family:var(--f-body);font-size:12px;font-weight:600}
.hsplit{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ===================== TARRO DE PELOTAS =====================

:root{

  --court:#0d1a38; --court-2:#08112a; --link:#a9c0ff; --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 18px -8px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --bg:#0a1122; --surface:#121b31; --soft:#18233d; --ink:#e8edf7; --muted:#9aa7c2; --line:#25324f;
  --court:#0d1a38; --court-2:#08112a; --link:#a9c0ff; --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 18px -8px rgba(0,0,0,.6)}

<script>
/* ===================== Datos y lógica ===================== */
const KEY='cuadro-tenis-pwa';
const PUNTOS_CAMPEON=100;
const PUNTOS_RONDA=[70,45,25,15,8,4,2]; // perdedor según rondas desde el final
const NOMBRES_RONDA=['Final','Semifinal','Cuartos de final','Octavos de final','16avos de final','32avos de final','64avos de final'];
const NOMBRES_CORTOS=['Final','Semis','Cuartos','Octavos','16avos','32avos','64avos'];
const NIVELES=['Primera','Segunda','Tercera','Cuarta','Quinta','Sexta'];
const RAMAS={M:'Masculino',F:'Femenino',X:'Mixto'};
const MODS={S:'Singles',D:'Dobles'};

function uid(){return Math.random().toString(36).slice(2,9)}
function nuevoTorneo(d={}){return {id:uid(),nombre:d.nombre||'Nuevo evento',sede:d.sede||'',inicio:d.inicio||'',fin:d.fin||'',organizador:d.organizador||'',creado:new Date().toISOString(),categorias:[]}}
function nuevoEstado(){return {v:3,jugadores:[],torneos:[{id:'club',nombre:'',categorias:[]}],noticias:[],galeria:[]}}
function migrar(d){
  if(!d) return d;
  if(d.v>=2||Array.isArray(d.torneos)) return normalizar(d);
  const t=nuevoTorneo(d.torneo||{});t.categorias=(d.categorias||[]).map(c=>({nivel:'',...c}));
  return normalizar({v:2,jugadores:(d.jugadores||[]).map(({puntos,...p})=>({categoria:'',cedula:'',...p})),torneos:[t]});
}
function normalizar(d){
  const fx=v=>v==='Principiantes'?'Sexta':v;
  (d.jugadores||[]).forEach(p=>p.categoria=fx(p.categoria));
  (d.torneos||[]).forEach(t=>t.categorias.forEach(c=>c.nivel=fx(c.nivel)));
  d.noticias=d.noticias||[];
  d.galeria=d.galeria||[];
  // Unificación: ya no hay eventos, cada torneo lleva su fecha y sede
  const evs=d.torneos||[];
  if(!(evs.length===1&&evs[0].id==='club')){
    const todos=[];evs.forEach(e=>e.categorias.forEach(c=>{c.inicio=c.inicio||e.inicio||'';c.fin=c.fin||e.fin||'';c.sede=c.sede||e.sede||'';todos.push([c,e])}));
    const cnt={};todos.forEach(([c])=>cnt[c.nombre]=(cnt[c.nombre]||0)+1);
    const corto=n=>String(n||'').replace(/\s*\(.*?\)\s*/g,' ').replace(/^torneo\s+/i,'').trim();
    if(evs.length>1)todos.forEach(([c,e])=>{if(cnt[c.nombre]>1&&corto(e.nombre))c.nombre=corto(e.nombre)+' · '+c.nombre});
    d.torneos=[{id:'club',nombre:'',categorias:todos.map(x=>x[0])}];
    d.noticias.forEach(n=>n.ev='club');
  }
  d.v=3;
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtCI(ci){const d=String(ci||'').replace(/\D/g,'');return d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''}

function jug(S,id){return S.jugadores.find(j=>j.id===id)}
function nombreCompleto(p){return p?`${p.nombre} ${p.apellido}`.trim():'—'}
function nombreCorto(p){return p?`${p.nombre?p.nombre[0]+'. ':''}${p.apellido}`:'—'}
function inscripto(cat,eid){return cat.inscriptos.find(i=>i.id===eid)}
function etiqueta(S,cat,eid,corto){
  const e=inscripto(cat,eid); if(!e) return '—';
  const ps=e.j.map(id=>jug(S,id));
  if(ps.length===1) return corto?nombreCorto(ps[0]):nombreCompleto(ps[0]);
  return ps.map(p=>p?p.apellido:'?').join(' / ');
}
function nivelIdx(p){const i=NIVELES.indexOf(p?.categoria);return i<0?NIVELES.length:i}
function elegibles(S,cat){return S.jugadores.filter(p=>(cat.rama==='X'||p.sexo===cat.rama)&&(!cat.nivel||p.categoria===cat.nivel)).sort((a,b)=>a.apellido.localeCompare(b.apellido))}

function posicionesSiembra(N){let a=[1];while(a.length<N){const L=a.length*2;a=a.flatMap(s=>[s,L+1-s])}return a}
function cantSembrados(n){return n<=8?2:n<=16?4:n<=32?8:16}
function tamCuadro(n){let N=2;while(N<n)N*=2;return N}

/* Ranking acumulado de los demás torneos: base para los cabezas de serie */
function acumulado(S,excluirCat,clave){
  const cats=S.torneos.flatMap(t=>t.categorias).filter(c=>c.id!==excluirCat&&(!clave||claveMod(c)===clave));
  const st=estadisticas(S,cats);const r={};Object.entries(st).forEach(([id,s])=>r[id]=s.pts);return r;
}
function ordenRanking(S,cat,lista,rnd=Math.random){
  const acc=acumulado(S,cat.id,claveMod(cat));
  const pts=e=>e.j.reduce((a,id)=>a+(acc[id]||0),0);

/* ---- Fase de grupos: todos contra todos, pasan los mejores al cuadro ---- */
const LETRAS='ABCDEFGHIJKLMNOP';

function armarGrupos(c,tam,pasan){

  orden.forEach((e,i)=>{const fila=Math.floor(i/nG),k=i%nG;lista[fila%2?nG-1-k:k].push(e.id)});

function partidosGrupo(c){

  G.lista.forEach((g,gi)=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){
    const key=`g${gi}-${i}-${j}`;const res=G.res[key];const a=g[i],b=g[j];
    const x={key,gi,r:-1,m:0,a,b,res:null,g:null,estado:'pendiente',grupo:LETRAS[gi],rr:!!G.rr};
    if(res&&(res.g===a||res.g===b)){x.res=res;x.g=res.g;x.estado='jugado'}

    out.push(x)}});

}
function tablaGrupo(c,gi){

  partidosGrupo(c).filter(x=>x.gi===gi&&x.estado==='jugado').forEach(x=>{const A=by[x.a],B=by[x.b];if(!A||!B)return;A.pj++;B.pj++;by[x.g].pg++;
    if(x.res.tipo!=='wo')(x.res.s||[]).forEach(([p,q])=>{if(p===''||p==null)return;p=+p;q=+q;A.gg+=p;A.gp+=q;B.gg+=q;B.gp+=p;if(p>q){A.sg++;B.sp++}else if(q>p){B.sg++;A.sp++}})});

  return st.sort((a,b)=>b.pg-a.pg||dueloGano(a.e,b.e)||(b.sg-b.sp)-(a.sg-a.sp)||(b.gg-b.gp)-(a.gg-a.gp)||etiqueta(S,c,a.e).localeCompare(etiqueta(S,c,b.e)));
}
const PUNTOS_RR=[100,70,45,25];

function campeonDe(c){if(esRR(c)) return gruposCompletos(c)?tablaGrupo(c,0)[0].e:null;return calcularCuadro(c)?.campeon||null}

function gruposCompletos(c){const ps=partidosGrupo(c);return ps.length>0&&ps.every(x=>x.estado==='jugado')}
function clasificados(c){const pasan=c.grupos.pasan||2;const tabs=c.grupos.lista.map((g,gi)=>tablaGrupo(c,gi));const out=[];
  for(let k=0;k<pasan;k++)tabs.forEach((t,gi)=>{if(t[k])out.push({e:t[k].e,gi,pos:k})});return out}
function generarDesdeGrupos(c){

  const capas=[];for(let k=0;k<pasan;k++){let capa=cl.filter(q=>q.pos===k);if(k%2===1){const h=Math.ceil(capa.length/2);capa=[...capa.slice(h),...capa.slice(0,h)]}capas.push(capa)}
  const orden=capas.flat().map(q=>inscripto(c,q.e)).filter(Boolean);if(orden.length<2) return false;
  const gi=Object.fromEntries(cl.map(q=>[q.e,q.gi]));
  const ll=armarLlave(orden,Math.min(G,cantSembrados(orden.length),orden.length));
  const M=ll.slots.length/2;
  for(let vuelta=0;vuelta<30;vuelta++){let ok=true;
    for(let m=0;m<M;m++){const a=ll.slots[2*m],b=ll.slots[2*m+1];if(!a||!b||gi[a]!==gi[b])continue;ok=false;
      for(let m2=0;m2<M;m2++){if(m2===m)continue;const a2=ll.slots[2*m2],b2=ll.slots[2*m2+1];if(!b2||ll.sem[b2])continue;

/* ---- Cuadro de consolación: juegan los que perdieron su primer partido ---- */
function llaveDe(c,z){return z==='cons'&&c.cons?{...c,cuadro:c.cons.cuadro,res:c.cons.res,_z:'cons'}:c}
function cuadroCons(c){if(!c.cons) return null;const L=llaveDe(c,'cons');const cb=calcularCuadro(L);if(!cb) return null;cb.rondas.forEach(f=>f.forEach(x=>x.cons=true));return {L,cb}}
function perdedoresPrimera(c){
  const cb=calcularCuadro(c);if(!cb) return [];const primero={};
  cb.rondas.forEach(f=>f.forEach(x=>{if(x.estado!=='jugado')return;[x.a,x.b].forEach(e=>{if(!(e in primero))primero[e]=x})}));
  return Object.entries(primero).filter(([e,x])=>x.g!==e).map(([e])=>e);
}
function armarConsolacion(c){

  const orden=ordenRanking(S,c,ls);

}
function rondaDe(x,cb,corto){return x.grupo?(x.rr?'Round robin':'Grupo '+x.grupo):(x.cons?'Consolación · ':'')+nombreRonda(x.r,cb.R,corto)}
/* Contexto de un partido para la hoja de resultado y la grilla: cuadro principal, consolación o grupo */
function ctxPartido(cid,z,k){
  const c=T().categorias.find(x=>x.id===cid);if(!c) return null;
  if(z==='grupo'){const x=partidosGrupo(c).find(p=>p.key===k);if(!x) return null;
    return {c,L:c,x,cb:null,z,res:c.grupos.res,titulo:x.rr?'Round robin':'Grupo '+x.grupo,final:false,despues:false}}
  const L=llaveDe(c,z);const cb=calcularCuadro(L);if(!cb) return null;const [r,m]=k.split('-').map(Number);const x=cb.rondas[r]?.[m];if(!x) return null;

}

function setsGanados(res){let a=0,b=0;(res.s||[]).forEach(([x,y])=>{if(x==null||y==null||x===''||y==='')return;if(+x>+y)a++;else if(+y>+x)b++});return[a,b]}

function calcularCuadro(cat){
  const c=cat.cuadro; if(!c) return null;
  const R=Math.log2(c.N); const rondas=[];
  for(let r=0;r<R;r++){
    const cant=c.N/2**(r+1); const fila=[];
    for(let m=0;m<cant;m++){
      let a,b; if(r===0){a=c.slots[2*m];b=c.slots[2*m+1]}else{a=rondas[r-1][2*m].g;b=rondas[r-1][2*m+1].g}
      const key=r+'-'+m; const res=cat.res?.[key];
      const x={key,r,m,a,b,res:null,g:null,estado:'espera'};
      if(r===0&&(!a||!b)){x.estado='bye';x.g=a||b||null}
      else if(a&&b){
        if(res&&(res.g===a||res.g===b)){x.res=res;x.g=res.g;x.estado='jugado'}
        else{x.estado='pendiente'; if(res&&(res.cancha||res.hora||res.dia))x.res={cancha:res.cancha,hora:res.hora,dia:res.dia}}
      } else if(res&&(res.cancha||res.hora||res.dia)) x.res={cancha:res.cancha,hora:res.hora,dia:res.dia};
      fila.push(x);
    }
    rondas.push(fila);
  }

}
function nombreRonda(r,R,corto){const f=R-1-r;return (corto?NOMBRES_CORTOS:NOMBRES_RONDA)[f]||`Ronda ${r+1}`}

function estadisticas(S,categorias){
  const st={};
  const get=id=>st[id]||(st[id]={pts:0,pj:0,pg:0,sg:0,sp:0,gg:0,gp:0,cats:{}});
  categorias.forEach(cat=>{
    const contar=x=>{
      const lado={a:x.a,b:x.b};
      ['a','b'].forEach((k,i)=>{
        const e=inscripto(cat,lado[k]); if(!e) return;
        e.j.forEach(pid=>{
          const s=get(pid); s.pj++; if(x.g===lado[k]) s.pg++;
          if(x.res.tipo!=='wo'){(x.res.s||[]).forEach(par=>{const[p,q]=i===0?par:[par[1],par[0]];if(p==null||q==null||p===''||q==='')return;s.gg+=+p;s.gp+=+q;if(+p>+q)s.sg++;else if(+q>+p)s.sp++})}
        });
      });
    };
    if(cat.grupos) partidosGrupo(cat).forEach(x=>{if(x.estado==='jugado')contar(x)});
    const cc=cuadroCons(cat); if(cc) cc.cb.rondas.forEach(f=>f.forEach(x=>{if(x.estado==='jugado')contar(x)}));
    const cb=calcularCuadro(cat);
    const alcanzo={};
    if(cb){
      cb.rondas.forEach(f=>f.forEach(x=>{
        [x.a,x.b].forEach(e=>{if(e&&x.estado!=='bye')alcanzo[e]=Math.max(alcanzo[e]??-1,x.r)});
        if(x.estado==='bye'&&x.g) alcanzo[x.g]=Math.max(alcanzo[x.g]??-1,0);
        if(x.estado==='jugado') contar(x);
      }));
      Object.entries(alcanzo).forEach(([eid,r])=>{
        const e=inscripto(cat,eid); if(!e) return;

        const etiq=camp?'Campeón':(f===0?'Finalista':nombreRonda(r,cb.R,true));
        e.j.forEach(pid=>{const s=get(pid);s.pts+=p;s.cats[cat.id]={p,etiq,nombre:cat.nombre,mod:cat.modalidad}});
      });
    }
    if(esRR(cat)){const tab=tablaGrupo(cat,0);const fin=gruposCompletos(cat);tab.forEach((o,i)=>{const e=inscripto(cat,o.e);if(!e)return;const p=PUNTOS_RR[i]??15;
      const etiq=fin&&i===0?'Campeón':fin&&i===1?'Finalista':`${i+1}.º round robin`;e.j.forEach(pid=>{const s=get(pid);s.pts+=p;s.cats[cat.id]={p,etiq,nombre:cat.nombre,mod:cat.modalidad}})})}
    else if(cat.grupos) cat.grupos.lista.flat().forEach(eid=>{if(eid in alcanzo)return;const e=inscripto(cat,eid);if(!e)return;
      e.j.forEach(pid=>{const s=get(pid);s.pts+=PUNTOS_GRUPO;s.cats[cat.id]={p:PUNTOS_GRUPO,etiq:'Fase de grupos',nombre:cat.nombre,mod:cat.modalidad}})});
  });
  return st;
}

    const filas=[{id:'principal',data:JSON.parse(str),updated_at:new Date().toISOString()},{id:'privado',data:priv,updated_at:new Date().toISOString()}];
    const {error}=await sb.from('tenis_estado').upsert(filas);
    if(error) throw error;
    lastSaved=str;setStatus('Guardado');
  }catch(e){
    const msg=String(e&&(e.message||e.code)||'');
    if(/row-level|permission|JWT|401|403/i.test(msg)){setStatus('Sin permiso para guardar');}
    else{setStatus('Sin conexión · reintentando…');setTimeout(flush,4000+Math.random()*2000)}
  }
  saving=false; if(pend){pend=false;flush()}
}
/* Datos privados (cédula, teléfono, nacimiento) van en una fila que solo lee el administrador */
const CAMPOS_PRIV=['cedula','telefono','nacimiento'];
function separar(S){
  const pub=JSON.parse(JSON.stringify(S));const priv={};
  (pub.jugadores||[]).forEach(p=>{const x={};CAMPOS_PRIV.forEach(k=>{if(p[k]!=null&&p[k]!==''){x[k]=p[k]}delete p[k]});
    const e=edadDe(x.nacimiento);if(e!=null)p.edad=e;else delete p.edad;if(Object.keys(x).length)priv[p.id]=x});
  delete pub.admin;
  return {pub,priv};
}
let privMap=null;
function mezclarPriv(){if(!S||!privMap)return;(S.jugadores||[]).forEach(p=>{const x=privMap[p.id];if(x)Object.assign(p,x)})}
async function cargarPriv(){
  if(!sb||!logueado){privMap=null;return}
  const {data}=await sb.from('tenis_estado').select('data').eq('id','privado').maybeSingle();
  privMap=(data&&data.data)||{};mezclarPriv();
}
function aplicarRemoto(d){
  if(timer||saving) return;
  const str=canon(d);if(S&&str===lastSaved) return;
  S=migrar(JSON.parse(str));lastSaved=str;mezclarPriv();
  try{localStorage.setItem(KEY+':cache',str)}catch(e){}
  renderFondo();revisarSeguidos();if(tv.on)pintarTV();
}
let sb=null,sesionSupa=null;
async function init(){
  modo='supa';
  if(!window.supabase||!window.CFG||!CFG.url||/TU-PROYECTO/.test(CFG.url)){cargarCache('Falta configurar Supabase en config.js');return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  assetsApi={
    upload:async(blob,o={})=>{const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const {error}=await sb.storage.from('tenis-fotos').upload(path,blob,{contentType:o.type||'image/jpeg',cacheControl:'31536000',upsert:false});
      if(error)throw error;return {id:path,url:blobUrl(path)}},
    delete:async id=>{await sb.storage.from('tenis-fotos').remove([id]);return {deleted:true}}
  };
  try{const {data}=await sb.auth.getSession();sesionSupa=data.session}catch(e){}
  // Importante: no llamar a Supabase directamente dentro de este aviso (bloquea el inicio de sesión).
  sb.auth.onAuthStateChange((ev,ses)=>{sesionSupa=ses;
    setTimeout(async()=>{
      try{
        if(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'){await verificarAdmin();actualizarPermisos();if(esAdmin&&!privMap)await cargarPriv()}
        if(ev==='SIGNED_OUT'){esAdmin=false;privMap=null;lastSaved='';await cargarRemoto()}
      }catch(e){}
      renderFondo();
    },0)});
  await cargarRemoto();
  if(sesionSupa){await verificarAdmin();actualizarPermisos();if(esAdmin)await cargarPriv();renderFondo()}
  sb.channel('estado').on('postgres_changes',{event:'*',schema:'public',table:'tenis_estado',filter:'id=eq.principal'},p=>{if(p.new&&p.new.data)aplicarRemoto(p.new.data)}).subscribe();
}
async function cargarRemoto(){
  try{
    const {data,error}=await sb.from('tenis_estado').select('data').eq('id','principal').maybeSingle();
    if(error) throw error;
    cargado=true;
    if(data&&data.data){lastSaved='';const str=canon(data.data);S=migrar(JSON.parse(str));lastSaved=str;mezclarPriv();try{localStorage.setItem(KEY+':cache',str)}catch(e){}setStatus('Guardado')}
    render();revisarSeguidos();
  }catch(e){cargarCache('Sin conexión: mostrando la última copia guardada')}
}
function cargarCache(msg){try{const raw=localStorage.getItem(KEY+':cache');if(raw)S=migrar(JSON.parse(raw))}catch(e){}cargado=true;setStatus(msg);render()}
function blobUrl(id){return sb?sb.storage.from('tenis-fotos').getPublicUrl(id).data.publicUrl:''}
function cargarLocal(){cargarCache('')}

let sesionMem=null;
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;try{render()}catch(x){}});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('App instalada.');try{render()}catch(x){}});
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone}
function installBtn(){
  if(deferredPrompt) return '<button class="lnk inst" data-act="instalar">'+ICO_PDF+'Instalar app en este dispositivo</button>';
  if(esIOS()) return '<span class="inst-ios">Para instalar en iPhone: tocá Compartir y luego “Agregar a inicio”.</span>';
  return '';
}
function nombreApp(){return (S&&S.club)||'Cuadro de Tenis'}
let esAdmin=false;
function sesionValida(){return !!sesionSupa&&esAdmin}
async function verificarAdmin(){
  if(!sb||!sesionSupa){esAdmin=false;return false}
  try{const {data}=await sb.from('tenis_admins').select('user_id').eq('user_id',sesionSupa.user.id).maybeSingle();esAdmin=!!data}catch(e){esAdmin=false}
  return esAdmin;
}
function adminEmail(){return sesionSupa?.user?.email||'administrador'}
function actualizarPermisos(){logueado=sesionValida();puedeEditar=permisoPlat&&logueado}
function iniciarSesion(h){const x={h,exp:Date.now()+12*3600000};sesionMem=x;try{localStorage.setItem(KEY+':ses',JSON.stringify(x))}catch(e){}}
function cerrarSesion(){sesionMem=null;try{localStorage.removeItem(KEY+':ses')}catch(e){}}
async function hashClave(u,p){
  const txt='cuadro-tenis|'+u.trim().toLowerCase()+'|'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h1=0x811c9dc5,h2=0x1234567;for(const ch of txt){const c=ch.charCodeAt(0);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822507)}return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
}

function vistaVacia(){
  return `<div class="panel empty">
    <h2>${esc(nombreApp())}</h2>
    <p class="muted">Todavía no hay torneos publicados. Cuando el club cargue su primer torneo, acá vas a ver los cuadros, los resultados y el ranking.</p>

  </div>`;

/* ---- Cifras del club y galería ---- */
function premiosEntregados(){
  let gs=0,n=0;
  S.torneos.forEach(e=>e.categorias.forEach(c=>{if(!campeonDe(c)||!c.premios)return;
    const v=(+c.premios.campeon||0)+(+c.premios.finalista||0);if(v){gs+=v;n++}}));
  return {gs,n};
}
function premioTag(c){
  const p=c.premios;if(!p||!(+p.campeon||+p.finalista)) return '';
  return `<span class="tag on">Campeón Gs. ${fmtCI(p.campeon)||0}</span>${+p.finalista?`<span class="tag on">Vicecampeón Gs. ${fmtCI(p.finalista)}</span>`:''}`;
}
function resumenClub(){
  const nT=S.torneos.reduce((a,e)=>a+e.categorias.length,0);
  const pr=premiosEntregados();
  return `<section class="kpis club" aria-label="El club en números">
    <div><b>${S.jugadores.length}</b><span>Jugadores registrados</span><em>${(()=>{const h=S.jugadores.filter(p=>p.sexo!=='F').length,m=S.jugadores.length-h;return `${h} ${h===1?'hombre':'hombres'} · ${m} ${m===1?'mujer':'mujeres'}`})()}</em></div>
    <div><b>${nT}</b><span>Torneos creados</span><em>${(()=>{const fin=S.torneos.reduce((a,e)=>a+e.categorias.filter(c=>campeonDe(c)).length,0);return `${fin} finalizado${fin===1?'':'s'} · ${nT-fin} en curso`})()}</em></div>
    <div class="gsk"><b>Gs. ${fmtCI(pr.gs)||0}</b><span>Entregados en premios</span><em>${pr.n} torneo${pr.n===1?'':'s'} con premio pagado</em></div>
  </section>`;
}
function srcFoto(f){return f.a?blobUrl(f.a):(f.src||'')}
function reel(g){
  let base=[...g];while(base.length<6)base=base.concat(g);
  const it=(f,dup)=>`<button class="ph-it" ${dup?'aria-hidden="true" tabindex="-1"':''} data-act="ver-foto" data-id="${f.id}" aria-label="${esc(f.titulo||'Foto')}"><img src="${esc(srcFoto(f))}" alt="${dup?'':esc(f.titulo||'Foto del club')}" loading="lazy"><span>${esc(f.titulo||'')}</span></button>`;
  return `<div class="reel"><div class="reel-track" style="--dur:${base.length*6}s">${base.map((f,k)=>it(f,k>=g.length)).join('')}${base.map(f=>it(f,true)).join('')}</div></div>`;
}
function galeria(){
  const g=[...(S.galeria||[])].sort((a,b)=>b.t-a.t);
  if(!g.length&&!puedeEditar) return '';
  const puedeSubir=puedeEditar&&(assetsApi||modo==='local');
  return `<section class="sec"><div class="sec-hd"><h2>Galería <span class="ct">${g.length||''}</span></h2>

async function reducir(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((ok,mal)=>{img.onload=ok;img.onerror=mal;img.src=url});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv;
  } finally {URL.revokeObjectURL(url)}
}
async function subirFotos(files){
  files=[...files];if(!files.length) return;
  S.galeria=S.galeria||[];let ok=0,mal=0;ui.msgGal=null;
  for(let i=0;i<files.length;i++){
    ui.subiendo=`Subiendo ${i+1} de ${files.length}…`;render();
    try{
      if(assetsApi){
        const cv=await reducir(files[i],1600);
        const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
        const res=await assetsApi.upload(blob,{type:'image/jpeg'});
        S.galeria.push({id:uid(),a:res.id,titulo:'',t:Date.now()+i});ok++;
      } else if(modo==='local'){
        const cv=await reducir(files[i],900);
        S.galeria.push({id:uid(),src:cv.toDataURL('image/jpeg',.72),titulo:'',t:Date.now()+i});ok++;
      } else {mal=files.length-i;break}
    }catch(e){mal++}
  }
  ui.subiendo=null;
  if(mal) ui.msgGal=`${mal} foto${mal===1?'':'s'} no se pudo subir. Probá con JPG o PNG de menos de 20 MB.`;
  if(ok) cambiar(); else render();
}

function edadDe(f){if(!f)return null;const [y,m,d]=f.split('-').map(Number);if(!y)return null;const h=new Date();let e=h.getFullYear()-y;if(h.getMonth()+1<m||(h.getMonth()+1===m&&h.getDate()<d))e--;return e>=0?e:null}
function edadJug(p){return p&&p.nacimiento?edadDe(p.nacimiento):(p&&p.edad!=null?p.edad:null)}
function hoyISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtMomento(ts){
  const d=new Date(ts);if(isNaN(d)) return '';
  const hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const hoy=new Date();const mismo=d.toDateString()===hoy.toDateString();
  return mismo?`Hoy · ${hh}`:`${d.getDate()} ${MESES[d.getMonth()]} · ${hh}`;

function esTB(c,i,p,q){return (Math.max(p,q)===7&&Math.min(p,q)===6)||(c.superTB&&c.sets===3&&i===2)}
function statsTorneo(c){
  const cb=calcularCuadro(c);const n=c.inscriptos.length;
  const r={cb,n,jg:0,tot:0,sets:0,games:0,tb:0,wo:0,vivos:n,ronda:''};
  const todos=[...partidosGrupo(c),...(cb?cb.rondas.flat():[]),...(cuadroCons(c)?.cb.rondas.flat()||[])];
  if(!todos.length) return r;
  let jgP=0;
  todos.forEach(x=>{
    if(x.estado==='bye')return;r.tot++;if(x.estado==='jugado'&&!x.grupo&&!x.cons)jgP++;
    if(x.estado!=='jugado')return;r.jg++;
    if(x.res.tipo!=='normal')r.wo++;
    (x.res.s||[]).forEach(([p,q],i)=>{if(p===''||p==null)return;r.sets++;const tb=c.superTB&&c.sets===3&&i===2;if(!tb)r.games+=(+p)+(+q);if(esTB(c,i,+p,+q))r.tb++});
  });
  if(!cb){if(esRR(c))r.ronda=campeonDe(c)?'':'Round robin';return r}
  r.vivos=cb.campeon?1:cb.rondas[0].reduce((a,x)=>a+(x.a?1:0)+(x.b?1:0),0)-jgP;
  let ri=-1;cb.rondas.forEach((f,i)=>{if(ri<0&&f.some(x=>x.estado==='pendiente'))ri=i});
  r.ronda=cb.campeon?'':ri>=0?nombreRonda(ri,cb.R):'Esperando resultados';
  return r;
}
function marcadorDe(x){
  if(x.res.tipo==='wo') return 'por W.O.';
  const s=(x.res.s||[]).filter(v=>v[0]!==''&&v[0]!=null).map(v=>(x.g===x.a?`${v[0]}-${v[1]}`:`${v[1]}-${v[0]}`)+(v[2]!=null?`(${x.g===x.a?tbDe(v,0)+'-'+tbDe(v,1):tbDe(v,1)+'-'+tbDe(v,0)})`:'')).join(' ');
  return s+(x.res.tipo==='ret'?' (ret.)':'');
}
function noticiasDe(t){

  (S.noticias||[]).filter(n=>n.ev===t.id).forEach(n=>out.push({t:n.t,tipo:'manual',tit:n.titulo,txt:n.texto,id:n.id}));

function revisarSeguidos(){
  if(!S||!seguidos.length) return;
  let prev=null;try{prev=JSON.parse(localStorage.getItem(KEY+':huella')||'null')}catch(e){}
  const now=huellaActual();
  if(prev){const avisos=[];
    Object.entries(now).forEach(([k,v])=>{if(prev[k]===v.f)return;const p=v.p,x=p.x;const ctx=`${p.c.nombre} · ${rondaDe(x,p.cb,true)}`;
      if(x.estado==='jugado'&&(!prev[k]||!prev[k].startsWith('jugado'))){const g=x.g,o=g===x.a?x.b:x.a;avisos.push({k,t:'Resultado',b:`${etiqueta(S,p.c,g)} le ganó a ${etiqueta(S,p.c,o)} ${marcadorDe(x)} · ${ctx}`})}
      else if(x.estado==='pendiente'){const cuando=[x.res?.dia?fmtDia(x.res.dia):'',x.res?.hora?x.res.hora+' hs':'',x.res?.cancha?'cancha '+x.res.cancha:''].filter(Boolean).join(' · ');
        avisos.push({k,t:prev[k]?'Cambio de horario':'Partido confirmado',b:`${textoPartido(p)}${cuando?' · '+cuando:''} · ${ctx}`})}});
    avisos.slice(0,3).forEach(a=>notificar(a.t,a.b,a.k));
    if(avisos.length>3) notificar('Novedades',`${avisos.length-3} novedades más de los jugadores que seguís.`,'mas');
    if(avisos.length) toast(avisos[0].t+': '+avisos[0].b,6000);
  }
  try{localStorage.setItem(KEY+':huella',JSON.stringify(Object.fromEntries(Object.entries(now).map(([k,v])=>[k,v.f]))))}catch(e){}
}
function notificar(titulo,cuerpo,tag){
  try{if(!('Notification' in window)||Notification.permission!=='granted') return;
    const o={body:cuerpo,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'cdt-'+tag};
    if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(titulo,o)).catch(()=>new Notification(titulo,o));
    else new Notification(titulo,o);
  }catch(e){}
}

/* ---- Cara a cara ---- */
function caraACara(a,b){
  const {ms}=datosPerfil(a);
  const vs=ms.filter(m=>inscripto(m.c,m.riv)?.j.includes(b));
  const juntos=ms.filter(m=>m.comp===b);
  const r={vs,juntos,ga:0,gb:0,sa:0,sb:0,gma:0,gmb:0};
  vs.forEach(m=>{m.gano?r.ga++:r.gb++;if(m.x.res.tipo==='wo')return;(m.x.res.s||[]).forEach((v,k)=>{if(v[0]===''||v[0]==null)return;const yo=+v[m.i],el=+v[1-m.i];if(yo>el)r.sa++;else if(el>yo)r.sb++;if(!(m.stb&&k===2)){r.gma+=yo;r.gmb+=el}})});
  return r;
}

/* ---- Evolución en el ranking ---- */
function fechaCat(c){return c.fin||c.inicio||(c.cuadro?.creado||c.grupos?.creado||'').slice(0,10)||''}
function evolucion(pid){
  const out={};
  MODALIDADES.forEach(([k,l])=>{
    const cats=todasCats().filter(c=>claveMod(c)===k&&(c.cuadro||c.grupos)).sort((a,b)=>fechaCat(a).localeCompare(fechaCat(b))||(a.cuadro?.creado||'').localeCompare(b.cuadro?.creado||''));
    const pts=[];
    cats.forEach((c,i)=>{if(!c.inscriptos.some(e=>e.j.includes(pid)))return;
      const est=estadisticas(S,cats.slice(0,i+1));if(!est[pid])return;
      const orden=Object.entries(est).sort((a,b)=>b[1].pts-a[1].pts||b[1].pg-a[1].pg||(b[1].sg-b[1].sp)-(a[1].sg-a[1].sp));
      pts.push({c,pos:orden.findIndex(([id])=>id===pid)+1,de:orden.length,pts:est[pid].pts});});
    if(pts.length) out[k]={l,pts};
  });
  return out;
}
function graficoEvolucion(serie){
  const W=900,H=190,pl=40,pr=20,pt=18,pb=40;const n=serie.length;const maxPos=Math.max(...serie.map(p=>p.de),2);
  const X=i=>n===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(n-1);const Y=pos=>pt+(pos-1)*(H-pt-pb)/(maxPos-1);
  const ticks=[1,Math.ceil(maxPos/2),maxPos].filter((v,i,a)=>a.indexOf(v)===i);
  const corto=t=>t.length>22?t.slice(0,21)+"…":t;
  return `<svg class="evo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puesto en el ranking torneo a torneo">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="evo-g"/><text x="${pl-8}" y="${Y(v)+4}" class="evo-t" text-anchor="end">#${v}</text>`).join('')}
    ${n>1?`<polyline points="${serie.map((p,i)=>X(i)+','+Y(p.pos)).join(' ')}" class="evo-l"/>`:''}
    ${serie.map((p,i)=>`<g><circle cx="${X(i)}" cy="${Y(p.pos)}" r="13" class="evo-p"/><text x="${X(i)}" y="${Y(p.pos)+4.5}" text-anchor="middle" class="evo-n">${p.pos}</text>
      <text x="${X(i)}" y="${H-14}" text-anchor="middle" class="evo-x">${esc(corto(p.c.nombre))}</text><title>${esc(p.c.nombre)}: puesto ${p.pos} de ${p.de}, ${p.pts} pts</title></g>`).join('')}
  </svg>`;
}
function seccionEvolucion(pid){
  const ev=evolucion(pid);const ks=Object.keys(ev);if(!ks.length) return '';
  if(!ui.evoK||!ev[ui.evoK]) ui.evoK=ks[0];
  const e=ev[ui.evoK];const ult=e.pts[e.pts.length-1],pri=e.pts[0];
  const delta=pri.pos-ult.pos;
  return `<section class="sec"><div class="sec-hd"><h2>Evolución en el ranking</h2>${ks.length>1?`<div class="chips">${ks.map(k=>`<button class="chip" aria-pressed="${ui.evoK===k}" data-act="evoK" data-k="${k}">${ev[k].l}</button>`).join('')}</div>`:''}</div>
    <div class="panel evo-wrap">${graficoEvolucion(e.pts)}
    <div class="small muted">${e.l}: hoy #${ult.pos} de ${ult.de}${e.pts.length>1?` · ${delta>0?'subió '+delta+' puesto'+(delta===1?'':'s'):delta<0?'bajó '+(-delta)+' puesto'+(delta===-1?'':'s'):'mantiene el puesto'} desde ${esc(pri.c.nombre)}`:''}. Puesto acumulado después de cada torneo.</div></div></section>`;
}

/* Destacados del club: lo que un organizador o jugador quiere saber de un vistazo */
function destacados(t){
  const tarjetas=[];
  // 1. Líderes del ranking global por modalidad
  const todas=S.torneos.flatMap(e=>e.categorias);
  const lideres=MODALIDADES.map(([k,l])=>{
    const st=estadisticas(S,todas.filter(c=>claveMod(c)===k));
    const top=Object.entries(st).filter(([,s])=>s.pts>0).sort((a,b)=>b[1].pts-a[1].pts||b[1].pg-a[1].pg)[0];
    return top?{k,l,p:jug(S,top[0]),pts:top[1].pts}:null;
  }).filter(Boolean);
  if(lideres.length) tarjetas.push(`<div class="hcard"><h3>Líderes del ranking</h3>
    ${lideres.map(x=>`<button class="hrow" data-act="ir-ranking" data-k="${x.k}"><span><b>${esc(nombreCompleto(x.p))}${bandera(x.p.pais)}</b><small>${x.l}</small></span><span class="v">${x.pts}<small> pts</small></span></button>`).join('')}</div>`);

  // datos de todo el club (todos los eventos)
  const st=estadisticas(S,todas);
  const conPJ=Object.entries(st).filter(([,s])=>s.pj>0);
  // 2. Más partidos ganados
  const ganadores=conPJ.sort((a,b)=>b[1].pg-a[1].pg||a[1].pj-b[1].pj||(b[1].sg-b[1].sp)-(a[1].sg-a[1].sp)).filter(([,s])=>s.pg>0).slice(0,3);
  if(ganadores.length) tarjetas.push(`<div class="hcard"><h3>Más partidos ganados</h3>
    ${ganadores.map(([id,s],i)=>{const p=jug(S,id);return `<div class="hrow"><span><b>${i+1}. ${esc(nombreCompleto(p))}</b><small>${esc(p?.club||'Sin club')} · sets ${s.sg}-${s.sp}</small></span><span class="v">${s.pg}<small>-${s.pj-s.pg}</small></span></div>`}).join('')}</div>`);

  // 3. Clubes con más victorias
  const clubes={};conPJ.forEach(([id,s])=>{const c=jug(S,id)?.club||'Sin club';const o=clubes[c]||(clubes[c]={pg:0,pj:0,j:new Set()});o.pg+=s.pg;o.pj+=s.pj;o.j.add(id)});
  const topClub=Object.entries(clubes).filter(([,o])=>o.pg>0).sort((a,b)=>b[1].pg-a[1].pg||a[1].pj-b[1].pj).slice(0,3);
  if(topClub.length) tarjetas.push(`<div class="hcard"><h3>Clubes con más victorias</h3>
    ${topClub.map(([c,o],i)=>`<div class="hrow"><span><b>${i+1}. ${esc(c)}</b><small>${o.j.size} jugador${o.j.size===1?'':'es'} · ${Math.round(o.pg/o.pj*100)}% de efectividad</small></span><span class="v">${o.pg}<small> G</small></span></div>`).join('')}</div>`);

  // 4. Cabezas de serie y sorpresas
  let sem=0,elim=0;const sorpresas=[];
  t.categorias.forEach(c=>{const cb=calcularCuadro(c);if(!cb)return;const S2=c.cuadro.sem||{};sem+=Object.keys(S2).length;
    cb.rondas.forEach(f=>f.forEach(x=>{if(x.estado!=='jugado')return;const p=x.g===x.a?x.b:x.a;if(S2[p]){elim++;if(!S2[x.g]||S2[x.g]>S2[p])sorpresas.push({c,x,p,n:S2[p]})}}))});
  // Tarjeta de cabezas de serie quitada del inicio a pedido del club


  // 5. Partido más largo
  let largo=null;
  todas.forEach(c=>{const cb=calcularCuadro(c);if(!cb)return;cb.rondas.forEach(f=>f.forEach(x=>{if(x.estado!=='jugado'||x.res.tipo==='wo')return;
    const g=(x.res.s||[]).reduce((a,[p,q],i)=>p===''||p==null?a:a+((c.superTB&&c.sets===3&&i===2)?1:(+p)+(+q)),0);
    if(!largo||g>largo.g)largo={c,x,cb,g}}))});
  if(largo) tarjetas.push(`<div class="hcard"><h3>Partido más largo</h3>
    <div class="hrow"><span><b>${esc(etiqueta(S,largo.c,largo.x.g))}</b><small>le ganó a ${esc(etiqueta(S,largo.c,largo.x.g===largo.x.a?largo.x.b:largo.x.a))}</small></span><span class="v">${largo.g}<small> games</small></span></div>
    <div class="small muted">${esc(marcadorDe(largo.x))} · ${esc(largo.c.nombre)}, ${esc(nombreRonda(largo.x.r,largo.cb.R).toLowerCase())}</div></div>`);

  return `<section class="sec"><div class="sec-hd"><h2>Destacados</h2><button class="btn sm" data-act="tv">${ICO_TV}Pantalla TV</button></div>
    ${tarjetas.length?`<div class="hgrid">${tarjetas.join('')}</div>`:'<div class="panel muted">Los destacados aparecen cuando cargues los primeros resultados: líderes del ranking, quién gana más partidos, clubes, cabezas de serie y el partido más largo.</div>'}</section>`;
}

/* ---- Eventos ---- */
function estadoTorneo(c,hoy){
  if(campeonDe(c)) return 'fin';
  if(c.cuadro||c.grupos) return 'curso';
  if(!c.inicio&&!c.fin) return 'sin';
  const ini=c.inicio||c.fin;
  return ini>hoy?'prox':'curso';
}
function todasCats(){return S.torneos.flatMap(e=>e.categorias)}
function estadoEvento(e,hoy){
  if(!e.inicio&&!e.fin) return 'sin';
  const ini=e.inicio||e.fin,fin=e.fin||e.inicio;
  return fin<hoy?'fin':ini>hoy?'prox':'curso';
}

function fotoJug(p){return p&&p.foto?(p.foto.a?blobUrl(p.foto.a):(p.foto.src||'')):''}
function iniciales(p){return ((p?.nombre||'')[0]||'')+((p?.apellido||'')[0]||'')}
function avatar(p,size,clase=''){const f=fotoJug(p);return `<span class="av ${clase}" style="--s:${size}px" aria-hidden="true">${f?`<img src="${esc(f)}" alt="" loading="lazy">`:esc(iniciales(p).toUpperCase())}</span>`}
function bloqueAvatar(p){
  const f=fotoJug(p);
  if(!puedeEditar) return `<div class="avw">${f?`<img class="av big" src="${esc(f)}" alt="Foto de ${esc(nombreCompleto(p))}">`:avatar(p,104,'big')}</div>`;
  return `<div class="avw"><button class="av big" style="--s:104px" data-act="foto-jug" aria-label="${f?'Cambiar foto':'Subir foto'}">${f?`<img src="${esc(f)}" alt="">`:esc(iniciales(p).toUpperCase())}</button>
    <span class="avcam" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    <input type="file" id="f-avatar" accept="image/jpeg,image/png,image/webp" hidden>
    ${f?'<button class="lnk2 avq" data-act="quitar-foto-jug">Quitar foto</button>':''}</div>`;
}
async function cuadrado(file,size){
  const url=URL.createObjectURL(file);
  try{const img=new Image();await new Promise((ok,mal)=>{img.onload=ok;img.onerror=mal;img.src=url});
    const l=Math.min(img.naturalWidth,img.naturalHeight);const cv=document.createElement('canvas');cv.width=cv.height=Math.min(size,l);
    cv.getContext('2d').drawImage(img,(img.naturalWidth-l)/2,(img.naturalHeight-l)/2,l,l,0,0,cv.width,cv.height);return cv}
  finally{URL.revokeObjectURL(url)}
}
async function subirAvatar(file,pid){
  const p=jug(S,pid);if(!p||!file)return;
  if(!assetsApi||!logueado){toast('Ingresá como administrador para subir fotos.');return}
  toast('Subiendo foto…',0);
  try{
    if(assetsApi){const cv=await cuadrado(file,512);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86));

function paisNombre(c){const x=PAISES.find(p=>p[0]===c);return x?x[1]:''}

/* ---- Perfil del jugador ---- */
function datosPerfil(pid){
  const parts=[],ms=[];
  S.torneos.forEach(e=>e.categorias.forEach(c=>{
    const ent=c.inscriptos.find(x=>x.j.includes(pid));if(!ent)return;
    const cb=calcularCuadro(c);
    const base=Date.parse(e.inicio||'')||Date.parse(c.cuadro?.creado||'')||0;
    let maxR=-1;
    if(cb) cb.rondas.forEach(f=>f.forEach(x=>{
      if(x.a!==ent.id&&x.b!==ent.id)return;
      if(x.estado==='bye'){maxR=Math.max(maxR,0);return}
      maxR=Math.max(maxR,x.r);
      if(x.estado!=='jugado')return;
      const i=x.a===ent.id?0:1;const riv=i===0?x.b:x.a;
      ms.push({e,c,cb,x,i,ent,riv,gano:x.g===ent.id,t:x.res.t||base+((x.r+1)*100+x.m)*60000,
        comp:ent.j.find(id=>id!==pid)||null,stb:c.superTB&&c.sets===3});
    }));
    const extra=[...partidosGrupo(c).map(x=>({x,cbx:null})),...(cuadroCons(c)?.cb.rondas.flat().map(x=>({x,cbx:cuadroCons(c).cb}))||[])];
    extra.forEach(({x,cbx})=>{if(x.estado!=='jugado'||(x.a!==ent.id&&x.b!==ent.id))return;const i=x.a===ent.id?0:1;
      ms.push({e,c,cb:cbx,x,i,ent,riv:i===0?x.b:x.a,gano:x.g===ent.id,t:x.res.t||base+(x.grupo?50:300)*60000,comp:ent.j.find(id=>id!==pid)||null,stb:c.superTB&&c.sets===3})});
    let etiq='Inscripto',pts=0;
    if(esRR(c)){const tab=tablaGrupo(c,0);const i=tab.findIndex(o=>o.e===ent.id);const fin=gruposCompletos(c);pts=PUNTOS_RR[i]??15;
      etiq=fin&&i===0?'Campeón':fin?`${i+1}.º round robin`:'En carrera · Round robin';parts.push({e,c,etiq,pts,camp:fin&&i===0,final:fin&&i<2});return}
    if(c.grupos&&c.grupos.lista.flat().includes(ent.id)&&!(cb&&maxR>=0)){etiq=cb||gruposCompletos(c)?'Fase de grupos':'En carrera · Grupos';pts=PUNTOS_GRUPO}
    if(cb&&maxR>=0){const f=cb.R-1-maxR;const camp=cb.campeon===ent.id;
      const elim=cb.rondas.some(fl=>fl.some(x=>x.estado==='jugado'&&(x.a===ent.id||x.b===ent.id)&&x.g!==ent.id));
      pts=camp?PUNTOS_CAMPEON:(PUNTOS_RONDA[f]??1);
      etiq=camp?'Campeón':!elim&&!cb.campeon?'En carrera · '+nombreRonda(maxR,cb.R,true):f===0?'Finalista':nombreRonda(maxR,cb.R,true);}
    parts.push({e,c,etiq,pts,camp:cb?.campeon===ent.id,final:cb&&maxR===cb.R-1});
  }));
  ms.sort((a,b)=>a.t-b.t);
  const st={pj:ms.length,pg:0,sg:0,sp:0,gg:0,gp:0,tbg:0,tbp:0,stbg:0,stbp:0,wof:0,woc:0,decG:0,decP:0,rem:0,racha:0,rachaTipo:'',mejor:0,largo:null};
  let cur=0;
  ms.forEach(m=>{
    if(m.gano){st.pg++;cur=cur>0?cur+1:1}else cur=cur<0?cur-1:-1;
    st.mejor=Math.max(st.mejor,cur);
    if(m.x.res.tipo==='wo'){m.gano?st.wof++:st.woc++;return}
    const sets=(m.x.res.s||[]).filter(v=>v[0]!==''&&v[0]!=null);let games=0;
    sets.forEach((v,k)=>{const yo=+v[m.i],el=+v[1-m.i];const esStb=m.stb&&k===2;
      if(yo>el)st.sg++;else if(el>yo)st.sp++;
      if(esStb){yo>el?st.stbg++:st.stbp++;games++;return}
      st.gg+=yo;st.gp+=el;games+=yo+el;
      if(Math.max(yo,el)===7&&Math.min(yo,el)===6){yo>el?st.tbg++:st.tbp++}});
    if(m.x.res.tipo==='normal'&&sets.length===m.c.sets){m.gano?st.decG++:st.decP++}
    if(m.gano&&sets.length>1&&+sets[0][m.i]<+sets[0][1-m.i])st.rem++;
    if(!st.largo||games>st.largo.g)st.largo={m,g:games};
  });
  st.racha=Math.abs(cur);st.rachaTipo=cur>0?'V':cur<0?'D':'';
  return {parts,ms,st};
}
function marcadorPropio(m){
  if(m.x.res.tipo==='wo') return 'W.O.';

const PDF_LIBS=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'];
let pdfListo=null;
function cargarPDF(){
  if(pdfListo) return pdfListo;
  pdfListo=PDF_LIBS.reduce((p,src)=>p.then(()=>new Promise((ok,mal)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>mal(new Error('lib'));document.head.appendChild(s)})),Promise.resolve())
    .catch(e=>{pdfListo=null;throw e});
  return pdfListo;
}
const C_VERDE=[19,101,79],C_GRIS=[88,106,100],C_SUAVE=[236,242,239],C_LINEA=[205,217,212],C_PELOTA=[232,239,180];
function pt(s){return String(s??'').replace(/[—–]/g,'-').replace(/…/g,'...').replace(/[‹›]/g,'').replace(/[^\x00-\xFF]/g,'')}
function toast(m,ms=3200){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(toast._t);if(ms)toast._t=setTimeout(()=>{el.hidden=true},ms);
}
function fechaHoy(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function encabezadoPDF(doc,titulo,sub){

}
function piePDF(doc){
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...C_GRIS);

}
function tabla(doc,o){

    styles:{font:'helvetica',fontSize:8.5,cellPadding:4,lineColor:C_LINEA,lineWidth:.5,textColor:[20,32,28]},
    headStyles:{fillColor:C_VERDE,textColor:255,fontStyle:'bold',fontSize:8},

function subtitulo(doc,txt,y){

async function guardarPDF(doc,nombre){
  piePDF(doc);
  const blob=doc.output('blob');
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename:nombre,data:blob});toast('Reporte descargado.')}
    catch(e){if(e&&e.code==='declined'){toast('Descarga cancelada.');return}toast('No se pudo descargar el PDF en esta vista.')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('Reporte descargado.');
}
function slug(s){return pt(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
async function conPDF(fn){

}
function corta(doc,t,w){t=pt(t);if(doc.getTextWidth(t)<=w)return t;while(t.length>2&&doc.getTextWidth(t+'.')>w)t=t.slice(0,-1);return t+'.'}

/* ===================== Importar desde Excel ===================== */
const XLSX_SRC='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let xlsxListo=null;
function cargarXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxListo) return xlsxListo;
  xlsxListo=new Promise((ok,mal)=>{const s=document.createElement('script');s.src=XLSX_SRC;s.onload=ok;s.onerror=()=>{xlsxListo=null;mal(new Error('lib'))};document.head.appendChild(s)});
  return xlsxListo;
}
const normTxt=v=>String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\*/g,'').replace(/\(.*?\)/g,'').trim().toLowerCase().replace(/\s+/g,' ');
function hojaXL(wb,nombre){const k=Object.keys(wb.Sheets).find(n=>normTxt(n)===normTxt(nombre));return k?wb.Sheets[k]:null}
function filasXL(ws){
  if(!ws) return [];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  if(!rows.length) return [];
  const head=rows[0].map(normTxt);
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r.some(v=>String(v).trim()!==''))continue;
    const o={_fila:i+1};head.forEach((h,j)=>{if(h)o[h]=r[j]});out.push(o);
  }
  return out;
}
function fechaXL(v){
  if(v===''||v==null) return '';
  if(v instanceof Date&&!isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}
const numXL=v=>{const d=String(v??'').replace(/\D/g,'');return d?+d:0};
function nivelXL(v){const t=normTxt(v);if(!t||t==='todas'||t==='sin categoria')return '';if(t==='principiantes')return 'Sexta';const n=NIVELES.find(x=>normTxt(x)===t);return n===undefined?null:n}

/* Aplica el Excel sobre una copia de los datos y devuelve el resumen; no toca S */
function procesarExcel(wb,base){
  const D=JSON.parse(JSON.stringify(base));const cats=D.torneos[0].categorias;
  const r={jNuevos:0,jAct:0,tNuevos:0,tAct:0,ins:0,errores:[],hojas:0};
  const err=(h,f,m)=>r.errores.push(`${h}, fila ${f}: ${m}`);
  const nombreJ=p=>normTxt(p.nombre+' '+p.apellido);
  const buscarJ=v=>{const t=String(v??'').trim();if(!t)return null;const ci=t.replace(/\D/g,'');
    if(ci&&ci.length>=5&&/^[\d.\s-]+$/.test(t))return D.jugadores.find(p=>p.cedula===ci)||null;
    const n=normTxt(t);return D.jugadores.find(p=>nombreJ(p)===n)||D.jugadores.find(p=>normTxt(p.apellido+' '+p.nombre)===n||normTxt(p.apellido+', '+p.nombre)===n)||null};
  // Jugadores
  const hJ=hojaXL(wb,'Jugadores');if(hJ)r.hojas++;
  filasXL(hJ).forEach(f=>{
    const nombre=String(f['nombre']||'').trim(),apellido=String(f['apellido']||'').trim();
    if(!nombre||!apellido){err('Jugadores',f._fila,'falta el nombre o el apellido');return}
    const ram=normTxt(f['rama']);const sexo=/^(damas?|f|femenino|mujer)/.test(ram)?'F':/^(caballeros?|m|masculino|hombre)/.test(ram)?'M':null;
    const ci=String(f['cedula']??'').replace(/\D/g,'');
    let p=(ci&&D.jugadores.find(x=>x.cedula===ci))||D.jugadores.find(x=>normTxt(x.nombre+' '+x.apellido)===normTxt(nombre+' '+apellido));
    if(!p&&!sexo){err('Jugadores',f._fila,'la rama tiene que ser Caballeros o Damas');return}
    const niv=nivelXL(f['categoria']);if(niv===null){err('Jugadores',f._fila,`categoría "${f['categoria']}" no válida (Primera a Sexta)`);return}
    const nac=fechaXL(f['fecha de nacimiento']);if(nac===null){err('Jugadores',f._fila,'fecha de nacimiento no válida (usá dd/mm/aaaa)');return}
    const alt=numXL(f['altura']);if(alt&&(alt<100||alt>230)){err('Jugadores',f._fila,'la altura va en centímetros, por ejemplo 178');return}
    const pais=paisDe(f['nacionalidad']);if(pais===null){err('Jugadores',f._fila,`nacionalidad "${f['nacionalidad']}" no reconocida (usá la lista de la plantilla)`);return}
    const mano=normTxt(f['mano habil']);const m=/^d/.test(mano)?'D':/^z/.test(mano)?'Z':'';
    const d={nombre,apellido};if(ci)d.cedula=ci;if(sexo)d.sexo=sexo;if(String(f['categoria']??'').trim())d.categoria=niv;
    ['club','telefono'].forEach(k=>{const v=String(f[k]??'').trim();if(v)d[k]=v});if(nac)d.nacimiento=nac;if(alt)d.altura=alt;if(m)d.mano=m;if(pais)d.pais=pais;
    if(p){Object.assign(p,d);delete p.ejemplo;r.jAct++}
    else{D.jugadores.push({id:uid(),categoria:'',cedula:'',club:'',telefono:'',...d});r.jNuevos++}
  });
  // Torneos
  const hT=hojaXL(wb,'Torneos');if(hT)r.hojas++;
  filasXL(hT).forEach(f=>{
    const nombre=String(f['nombre']||'').trim();if(!nombre){err('Torneos',f._fila,'falta el nombre');return}
    const mo=normTxt(f['modalidad']);const modalidad=/^s/.test(mo)?'S':/^d/.test(mo)?'D':null;
    const ra=normTxt(f['rama']);const rama=/^(m|caballeros|hombres)/.test(ra)&&!/^mix/.test(ra)?'M':/^(f|damas|mujeres)/.test(ra)?'F':/^mix/.test(ra)?'X':null;
    let c=cats.find(x=>normTxt(x.nombre)===normTxt(nombre));
    if(!c&&(!modalidad||!rama)){err('Torneos',f._fila,'modalidad (Singles/Dobles) y rama (Masculino/Femenino/Mixto) son obligatorias');return}
    if(modalidad==='S'&&rama==='X'){err('Torneos',f._fila,'Mixto es solo para Dobles');return}
    const niv=nivelXL(f['categoria de jugadores']);if(niv===null){err('Torneos',f._fila,'categoría de jugadores no válida');return}
    const ini=fechaXL(f['desde']),fin=fechaXL(f['hasta']);if(ini===null||fin===null){err('Torneos',f._fila,'fecha no válida (usá dd/mm/aaaa)');return}
    if(ini&&fin&&fin<ini){err('Torneos',f._fila,'la fecha "Hasta" es anterior a "Desde"');return}
    const sets=numXL(f['sets']);const stb=normTxt(f['super tie-break']);
    const d={nombre};if(ini)d.inicio=ini;if(fin)d.fin=fin;const sede=String(f['sede']??'').trim();if(sede)d.sede=sede;
    if(sets===3||sets===5)d.sets=sets;if(stb)d.superTB=/^(si|s|yes|x|1|true)/.test(stb);
    const pc=numXL(f['premio campeon']),pf=numXL(f['premio vicecampeon']);if(pc||pf)d.premios={campeon:pc,finalista:pf};
    if(c){
      if(c.inscriptos.length&&((modalidad&&modalidad!==c.modalidad)||(rama&&rama!==c.rama)||(String(f['categoria de jugadores']??'').trim()&&niv!==(c.nivel||'')))){err('Torneos',f._fila,`"${nombre}" ya tiene inscriptos: no se cambió modalidad, rama ni categoría (el resto sí)`)}
      else{if(modalidad)c.modalidad=modalidad;if(rama)c.rama=rama;if(String(f['categoria de jugadores']??'').trim())c.nivel=niv}
      Object.assign(c,d);r.tAct++;
    } else {cats.push({id:uid(),modalidad,rama,nivel:niv||'',sets:3,superTB:true,inscriptos:[],cuadro:null,res:{},...d});r.tNuevos++}
  });
  // Inscripciones
  const hI=hojaXL(wb,'Inscripciones');if(hI)r.hojas++;
  filasXL(hI).forEach(f=>{
    const tn=String(f['torneo']||'').trim();const c=cats.find(x=>normTxt(x.nombre)===normTxt(tn));
    if(!c){err('Inscripciones',f._fila,`no existe el torneo "${tn}"`);return}
    if(c.cuadro){err('Inscripciones',f._fila,`"${c.nombre}" ya tiene el cuadro generado`);return}
    const a=buscarJ(f['jugador 1']),b=buscarJ(f['jugador 2']);
    if(!a){err('Inscripciones',f._fila,`no se encontró el jugador "${f['jugador 1']}"`);return}
    const apto=p=>(c.rama==='X'||p.sexo===c.rama)&&(!c.nivel||p.categoria===c.nivel);
    if(c.modalidad==='S'){
      if(!apto(a)){err('Inscripciones',f._fila,`${a.nombre} ${a.apellido} no corresponde a la rama o categoría del torneo`);return}
      if(c.inscriptos.some(e=>e.j.includes(a.id)))return;
      c.inscriptos.push({id:a.id,j:[a.id]});r.ins++;
    } else {
      if(!b){err('Inscripciones',f._fila,'en dobles falta el Jugador 2 (o no se encontró)');return}
      if(a.id===b.id){err('Inscripciones',f._fila,'los dos jugadores son la misma persona');return}
      if(!apto(a)||!apto(b)){err('Inscripciones',f._fila,'algún jugador no corresponde a la rama o categoría del torneo');return}
      if(c.rama==='X'&&a.sexo===b.sexo){err('Inscripciones',f._fila,'en mixtos la pareja es una dama y un caballero');return}
      if(c.inscriptos.some(e=>e.j.includes(a.id)&&e.j.includes(b.id)))return;
      if(c.inscriptos.some(e=>e.j.includes(a.id)||e.j.includes(b.id))){err('Inscripciones',f._fila,'alguno ya está inscripto en ese torneo con otra pareja');return}
      c.inscriptos.push({id:uid(),j:[a.id,b.id]});r.ins++;
    }
  });
  return {datos:D,r};
}
async function leerExcel(file){
  ui.xl={estado:'leyendo',nombre:file.name};renderSheet();
  try{await cargarXLSX()}catch(e){ui.xl={estado:'error',msg:'No se pudo cargar el lector de Excel. Revisá la conexión.'};renderSheet();return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const res=procesarExcel(wb,S||nuevoEstado());
    if(!res.r.hojas){ui.xl={estado:'error',msg:'El archivo no tiene hojas llamadas Jugadores, Torneos o Inscripciones. Usá la plantilla.'};renderSheet();return}
    ui.xl={estado:'listo',nombre:file.name,...res};renderSheet();
  }catch(e){ui.xl={estado:'error',msg:'No se pudo leer el archivo. Tiene que ser .xlsx (Excel).'};renderSheet()}
}

      ${nada?'<div class="note">No hay nada para importar.</div>':'<div class="btns"><button class="btn pri" data-act="xl-ok" data-primary>Importar ahora</button></div>'}</div>`}

    <input type="file" id="f-xl" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    ${cuerpo}`;
}

function seccionCuadro(c,cb,titulo='Cuadro'){

      const meta=[x.res?.cancha?'Cancha '+esc(x.res.cancha):'',x.res?.hora?esc(x.res.hora):''].filter(Boolean).join(' · ');
      const extra=x.estado==='jugado'&&x.res.tipo==='ret'?'Retiro':x.estado==='jugado'&&x.res.tipo==='wo'?'W.O.':'';
      return `<div class="mw"><button class="match ${x.estado==='bye'?'bye':''} ${!clic?'wait':''} ${ui.pop===(c._z||'')+x.key?'pop':''}" style="--ns:${ns}" ${clic?`data-act="partido" data-c="${c.id}" data-z="${c._z||''}" data-k="${x.key}"`:'tabindex="-1"'} aria-label="${esc(nombreRonda(r,cb.R))}">
        ${fila(x,'a')}${fila(x,'b')}${meta||extra?`<div class="mmeta"><span>${meta}</span><span>${extra}</span></div>`:''}</button></div>`}).join('')}

function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v)}
/* Actualiza la pantalla por datos que llegan de fondo sin rehacer un formulario abierto */
let congelarHoja=false;
function renderFondo(){if(ui.sheet){congelarHoja=true;try{render()}finally{congelarHoja=false}}else render()}
/* Muestra la casilla de tie-break solo en los sets que terminaron 7-6 */
/* Puntos de tie-break del jugador i (0 = primero, 1 = segundo). Formato viejo [p,q,perdedor]: el ganador hizo 7 o perdedor+2 */
function tbDe(s,i){if(s[2]==null)return null;if(s.length>=4)return s[2+i];const gana=+s[i]>+s[1-i];return gana?Math.max(7,+s[2]+2):+s[2]}
/* Muestra un error en el formulario abierto sin rehacerlo, para no perder lo que se escribió */
function avisar(m){
  ui.msg=m;const sh=document.querySelector('.sheet');
  if(!sh){renderSheet();return}
  let n=sh.querySelector('.note.err');
  if(!n){n=document.createElement('div');n.className='note err';const bs=sh.querySelectorAll('.btns');const ref=bs[bs.length-1];if(ref)ref.before(n);else sh.appendChild(n)}
  n.textContent=m;try{n.scrollIntoView({block:'nearest'})}catch(e){}
}

async function imagenCuadro(c){
  const cb=calcularCuadro(c);if(!cb) return null;const R=cb.R,r0=cb.rondas[0].length;
  const W=Math.max(1350,R*320+200),bh=86,gap=16,top=320,H=top+r0*(bh+gap)+160;
  const {cv,x}=await lienzo(W,H,c.nombre,'Cuadro · '+[rangoFechas(c),c.sede].filter(Boolean).join(' · '));
  const colW=(W-120-(cb.campeon?240:0))/R;const bw=colW-40;
  const cy=(r,m)=>{const span=(r0*(bh+gap))/cb.rondas[r].length;return top+span*m+span/2};
  cb.rondas.forEach((f,r)=>{const X=60+r*colW;x.fillStyle='rgba(255,255,255,.7)';x.font=F_B(700,22);x.fillText(nombreRonda(r,R).toUpperCase(),X,top-20);
    f.forEach((m,i)=>{const Y=cy(r,i)-bh/2;rrect(x,X,Y,bw,bh,10);x.fillStyle=m.estado==='bye'?'rgba(255,255,255,.12)':'#fff';x.fill();
      [['a',0],['b',1]].forEach(([l,k])=>{const e=m[l];const yy=Y+(k?bh*0.75:bh*0.27);const gana=m.g===e&&m.estado==='jugado';
        if(gana){x.fillStyle=AMA;x.fillRect(X,Y+(k?bh/2:0),bw,bh/2)}
        x.fillStyle=m.estado==='bye'?'rgba(255,255,255,.7)':AZUL;x.textBaseline='middle';const t=e?etiqueta(S,c,e,true):(r===0?'Bye':'A definir');
        ajustar(x,t,bw-90,26,n=>F_B(gana?700:400,n));x.fillText(t,X+12,yy);
        if(m.estado==='jugado'&&m.res.tipo!=='wo'){const sc=(m.res.s||[]).filter(v=>v[0]!==''&&v[0]!=null).map(v=>v[k]).join(' ');x.font=F_B(700,22);x.textAlign='right';x.fillText(sc,X+bw-10,yy);x.textAlign='left'}
        x.textBaseline='alphabetic'});
      if(r<R-1){x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;const X2=X+bw,Xm=X+colW-20;x.beginPath();x.moveTo(X2,cy(r,i));x.lineTo(Xm,cy(r,i));x.lineTo(Xm,cy(r+1,Math.floor(i/2)));x.lineTo(X+colW,cy(r+1,Math.floor(i/2)));x.stroke()}
    })});
  if(cb.campeon){const X=W-60-220,Y=cy(R-1,0)-70;rrect(x,X,Y,220,140,16);x.fillStyle=AMA;x.fill();x.fillStyle=AZUL;x.font=F_B(700,22);x.textAlign='center';x.fillText('CAMPEÓN',X+110,Y+40);
    const t=etiqueta(S,c,cb.campeon,true).toUpperCase();ajustar(x,t,196,44,F_D);x.fillText(t,X+110,Y+95);x.textAlign='left'}
  pieImagen(x,W,H);return cv;
}
function opcionesCompartir(c){

async function prepararImagen(){
  const s=ui.sheet;if(!s||s.t!=='compartir') return;const c=todasCats().find(x=>x.id===s.c);if(!c) return;
  const tok=s.tok=Math.random();s.img=null;renderSheet();
  let cv=null;try{
    if(s.tipo==='camp')cv=await imagenCampeon(c);
    else if(s.tipo==='cuadro')cv=await imagenCuadro(c);
    else if(s.tipo==='res'&&s.k){const [z,k]=s.k.split('|');cv=await imagenResultado(c,z,k)}
  }catch(e){console.error(e)}
  if(ui.sheet!==s||s.tok!==tok) return;
  s.img=cv?cv.toDataURL('image/png'):'';s.err=!cv;renderSheet();
}
function textoCompartir(){
  const s=ui.sheet;const c=todasCats().find(x=>x.id===s.c);if(!c) return '';const url=location.origin+location.pathname;
  if(s.tipo==='camp'){return `${etiqueta(S,c,campeonDe(c))} ${c.modalidad==='D'?'son campeones':c.rama==='F'?'es campeona':'es campeón'} de ${c.nombre}. Mirá el cuadro: ${url}`}
  if(s.tipo==='cuadro') return `Cuadro de ${c.nombre} en ${nombreApp()}: ${url}`;
  const [z,k]=(s.k||'').split('|');const P=ctxPartido(c.id,z,k);if(!P) return url;const g=P.x.g,o=g===P.x.a?P.x.b:P.x.a;
  return `${etiqueta(S,c,g)} le ganó a ${etiqueta(S,c,o)} ${marcadorDe(P.x)} · ${c.nombre}, ${P.titulo.toLowerCase()}. Más resultados: ${url}`;
}
async function compartirImagen(modo){
  const s=ui.sheet;if(!s||!s.img) return;const blob=await (await fetch(s.img)).blob();const nombre=`${slug(nombreApp())}-${s.tipo}.png`;
  const file=new File([blob],nombre,{type:'image/png'});const txt=textoCompartir();
  if(modo==='share'&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:txt});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=s.img;a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  if(modo==='wa'){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener');toast('Se descargó la imagen: adjuntala en WhatsApp.',5000)}
  else toast('Imagen descargada.');
}

const tv={on:false,tick:0,i:0,timer:null};
function abrirTV(){tv.on=true;tv.tick=0;tv.i=0;document.body.classList.add('tv-on');try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
  pintarTV();clearInterval(tv.timer);tv.timer=setInterval(()=>{tv.tick++;if(tv.tick%12===0){tv.i++;pintarTV()}else{const r=document.getElementById('tv-reloj');if(r)r.textContent=relojTV()}},1000)}
function cerrarTV(){tv.on=false;clearInterval(tv.timer);document.getElementById('tv')?.remove();document.body.classList.remove('tv-on');try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
function relojTV(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

  const todas=todasCats();
  MODALIDADES.forEach(([k,l])=>{const st=estadisticas(S,todas.filter(c=>claveMod(c)===k));const top=Object.entries(st).filter(([,x])=>x.pts>0).sort((a,b)=>b[1].pts-a[1].pts||b[1].pg-a[1].pg).slice(0,7);
    if(top.length>=2) out.push({t:'Ranking · '+l,h:`<div class="tv-list">${top.map(([id,x],i)=>{const p=jug(S,id);return `<div class="tv-row"><span class="tv-h"><span class="rk tv-rk">${i+1}</span></span><span class="tv-m"><b>${esc(nombreCompleto(p))}${bandera(p?.pais)}</b><small>${esc(p?.club||'')}${p?.categoria?' · '+esc(p.categoria):''}</small></span><span class="tv-c tv-pts">${x.pts}<small> pts</small></span></div>`}).join('')}</div>`})});

  if(!out.length) out.push({t:nombreApp(),h:'<div class="tv-vacio">Pronto vas a ver acá los partidos, los resultados y el ranking del club.</div>'});

/* ===================== Historial de campeones ===================== */
function vistaCampeones(){
  const xs=todasCats().map(c=>{const e=campeonDe(c);return e?{c,e}:null}).filter(Boolean).sort((a,b)=>fechaCat(b.c).localeCompare(fechaCat(a.c)));
  if(!xs.length) return '<div class="panel muted">Todavía no hay campeones. Cuando un torneo termine, su campeón queda guardado acá año por año.</div>';
  const titulos={};xs.forEach(({c,e})=>inscripto(c,e)?.j.forEach(id=>titulos[id]=(titulos[id]||0)+1));
  const top=Object.entries(titulos).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const anios={};xs.forEach(o=>{const y=(fechaCat(o.c)||'').slice(0,4)||'Sin fecha';(anios[y]=anios[y]||[]).push(o)});
  return `${top.length&&top[0][1]>1?`<div class="hcard"><h3>Más títulos</h3>${top.map(([id,n])=>{const p=jug(S,id);return `<button class="hrow" data-act="ver-jug" data-id="${id}"><span class="tit-p">${avatar(p,40)}<span><b>${esc(nombreCompleto(p))}${bandera(p?.pais)}</b><small>${esc(p?.club||'')}</small></span></span><span class="v">${n}<small> título${n===1?'':'s'}</small></span></button>`}).join('')}</div>`:''}
    ${Object.keys(anios).sort().reverse().map(y=>`<section class="sec"><div class="sec-hd"><h2>${esc(y)} <span class="ct">${anios[y].length}</span></h2></div><div class="list">${anios[y].map(({c,e})=>{
      return `<button class="rowbtn camprow" data-act="ver-cat" data-id="${c.id}"><span class="camp-av">${(inscripto(c,e)?.j||[]).map(id=>avatar(jug(S,id),56,'camp-foto')).join('')}</span><span class="n">${esc(etiqueta(S,c,e))}${banderasEntrada(c,e)}</span><span class="d">${esc(c.nombre)} · ${esc(resumenFinal(c))}${c.premios?.campeon?' · Gs. '+fmtCI(c.premios.campeon):''}</span><span class="r"><span class="tag g">${esRR(c)?'Round robin':MODS[c.modalidad]}</span></span></button>`}).join('')}</div></section>`).join('')}`;
}

}
